# Pi Zero / Zero W (BCM2835, ARM11 single-core 1 GHz, 512 MB RAM).
# systemd drop-in installed at /etc/systemd/system/splits.service.d/
# when install.sh is run with PROFILE=pi-zero. Tightens caps and
# trades CPU for memory to keep the service alive on the smaller box.

[Service]
# Tighter memory budget — Pi Zero shares 512 MB with the kernel, the
# desktop (if any), and Caddy. Leave headroom; SQLite write spikes
# are short-lived.
MemoryHigh=192M
MemoryMax=256M

# Aggressive GC: trade ~2× GC CPU for ~30% smaller heap. ARM11 has
# the cycles (workload is I/O-bound), the RAM matters more.
Environment=GOGC=20

# Single core: cap goroutine parallelism so the runtime doesn't
# context-switch its own GC against the request handlers.
Environment=GOMAXPROCS=1
