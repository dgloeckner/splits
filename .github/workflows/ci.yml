# CI: lint, test and build on every PR and every push to main.
# Release packaging lives in release.yml. See ADR-0022.
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  # One Node for every job. web/README.md says "Node 20 or later"; 22 is the
  # current LTS the lockfile was written with.
  NODE_VERSION: '22'

concurrency:
  group: ci-${{ github.ref }}
  # Supersede stale PR runs; never cancel a run on main.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  backend:
    name: backend (vet, staticcheck, test -race, coverage floor)
    # Pinned image rather than ubuntu-latest: the caches below are keyed on
    # what the image ships, and a silent image bump should not rotate them.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - run: go vet ./...
      # Pinned: staticcheck@latest (v0.8.x / 2026.2) requires Go 1.26, and
      # setup-go runs the go.mod toolchain (1.25.x) with GOTOOLCHAIN=local.
      # v0.7.0 is staticcheck 2026.1. Keep in sync with STATICCHECK_VERSION in
      # scripts/backend.sh.
      - run: go install honnef.co/go/tools/cmd/staticcheck@v0.7.0
      - run: staticcheck ./...
      # -race is the default locally too (scripts/backend.sh test); it has
      # caught real concurrency bugs in the sessionizer. atomic is the only
      # cover mode -race accepts. Same command as `scripts/backend.sh coverage`.
      - run: go test -race -covermode=atomic -coverprofile=coverage.out ./...
      # Never-decreasing statement-coverage floor (ADR-0022). Raise
      # backend/.coverage-floor in the PR that earns it.
      - run: bash ../scripts/check-coverage.sh .coverage-floor coverage.out
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: backend-coverage
          path: backend/coverage.out
          if-no-files-found: ignore
          retention-days: 14

  web:
    name: web (lint, typecheck, vitest + coverage, build)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      # Full checkout: vitest reads specs/int/fixtures/golden/*.jsonl.
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      # vite.config.ts bakes `git rev-parse --short HEAD` plus a "-dirty"
      # suffix into __BUILD_SHA__ (the offline cache buster). Fail loudly if
      # npm ci rewrote the lockfile, otherwise every CI build would be
      # "dirty".
      - run: git diff --exit-code -- package-lock.json
      # Blocking: main is lint-clean, so any ESLint problem fails the job.
      - run: npm run lint
      - run: npm run typecheck
      # vitest with the v8 provider; the thresholds in vite.config.ts are the
      # web coverage floor (ADR-0022) and fail this step when undercut.
      - run: npm run test:coverage
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: web-coverage
          path: web/coverage/lcov.info
          if-no-files-found: ignore
          retention-days: 14
      - run: npm run build

  deploy:
    name: deploy (shellcheck, updater suites, install.sh on real systemd)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      # Tripwire, not a secret scanner (issue #23): a DuckDNS token once sat
      # in dev/Caddyfile. Fails on a duckdns DNS-provider / `api_token` argument
      # that is not a {{PLACEHOLDER}}, and on a UUID-shaped value on any
      # line that mentions duckdns (the all-zero test dummy is allowed).
      # Matches are printed with UUIDs masked.
      - name: no DuckDNS token in the tree
        run: |
          hits="$( {
            git grep -nIE 'dns[[:space:]]+duckdns[[:space:]]+[^[:space:]{]' || true
            git grep -nIE 'api_token[[:space:]]+[^[:space:]{]' || true
            git grep -nIiE 'duckdns.*[0-9a-f]{8}(-[0-9a-f]{4}){3}-[0-9a-f]{12}' \
              | grep -v '00000000-0000-0000-0000-000000000000' || true
          } | sort -u )"
          if [ -n "$hits" ]; then
            echo "::error::DuckDNS token in the tree — use {{DUCKDNS_TOKEN}} and rotate the leaked one"
            printf '%s\n' "$hits" | sed -E 's/[0-9a-fA-F]{8}(-[0-9a-fA-F]{4}){3}-[0-9a-fA-F]{12}/<redacted>/g'
            exit 1
          fi
      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      # shellcheck ships with the runner image. Warnings and errors block;
      # info-level notes (ls | awk in the build scripts) do not.
      - run: shellcheck -S warning deploy/*.sh deploy/test/*.sh dev/*.sh
      # The updater against a sandbox: fake curl/systemctl/cp, temp install
      # root (ADR-0023 §3, FEAT-0016 stage 3). GNU mv -T and sha256sum are
      # what the runner and Pi OS both ship.
      - run: bash deploy/test/updater-version.sh
      - run: bash deploy/test/updater-flow.sh
      - run: command -v sqlite3 || sudo apt-get install -y sqlite3
      # Two bundles of the real packaging, older first. The PWA is not what
      # is under test here, so a one-file web/dist stands in for it.
      - name: bundles
        run: |
          mkdir -p web/dist && echo '<!doctype html><title>splits</title>' > web/dist/index.html
          TARGET=amd64 VERSION=v0.0.1 WEB_SKIP=1 bash deploy/bundle.sh
          TARGET=amd64 VERSION=v0.0.2 WEB_SKIP=1 bash deploy/bundle.sh
      # The runner is a throwaway VM with systemd as PID 1, which is what
      # install.sh is about (ADR-0023 §2, FEAT-0016 stage 2).
      - run: >
          sudo SPLITS_INSTALL_TEST=1 bash deploy/test/install-flow.sh
          dist/splits-linux-amd64-v0.0.1.tar.gz dist/splits-linux-amd64-v0.0.2.tar.gz

  e2e:
    name: e2e (playwright, shard ${{ matrix.shard }}/2)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # Two shards, one worker each: each test spawns Vite + Go backend +
    # Chromium, so a second worker on one runner starves the first, while a
    # second runner halves the wall time (~11 min -> ~6 min). Playwright
    # shards by test count, which balances well enough here.
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5
      # The Playwright fixtures `go build` the backend themselves
      # (web/tests/e2e/helpers/backend.ts), so both toolchains are needed.
      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      # Browser binaries are ~280 MB per run; keep them between runs. Keyed on
      # the lockfile, which pins the @playwright/test version that decides the
      # browser build. The apt system deps are not cached (fresh runner each
      # time) but cost ~20 s.
      - uses: actions/cache@v4
        id: pw-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('web/package-lock.json') }}
      - run: npx playwright install-deps chromium
      - run: npx playwright install chromium
        if: steps.pw-cache.outputs.cache-hit != 'true'
      # The seed helpers (tests/e2e/helpers/seedTrends.ts,
      # seedStaleOpenSession.ts) shell out to the sqlite3 CLI.
      - run: command -v sqlite3 || sudo apt-get install -y sqlite3
      # Default ("human") mode on purpose: playwright.config.ts auto-spawns
      # Vite on :5173 for the legacy specs that hardcode :8080, while the
      # fixture-based specs (tests/e2e/fixtures.ts) spawn their own Vite +
      # backend per worker. One worker: each test runs Vite + Go backend +
      # Chromium, and on a 4-vCPU runner two workers time out on each other.
      # Excluded: capture-only suites that only write PNGs for human review
      # (theme-screenshots, ux-audit). The e2e-critic regression script is
      # excluded in playwright.config.ts (testIgnore) since it runs on load.
      # --retries=1 (CI only): a test that passes on retry is reported as
      # "flaky" in the JSON report and the summary below, not hidden — so a
      # one-off timeout on a slow runner does not block, but a pattern shows.
      - run: npx playwright test --workers=1 --retries=1 --shard=${{ matrix.shard }}/2 --grep-invert "theme-screenshots|ux-audit" --reporter=line,json
        env:
          CI: "1"
          PLAYWRIGHT_JSON_OUTPUT_NAME: results.json
      # A run that exits before collecting any test (a script that calls
      # process.exit on import once ended the run after 3 s, exit code 0)
      # must not pass as green. Read the JSON report and insist on tests.
      - name: Fail if no tests ran
        if: always()
        run: |
          node -e '
            const fs = require("fs");
            if (!fs.existsSync("results.json")) { console.error("no results.json: playwright did not finish"); process.exit(1); }
            const s = JSON.parse(fs.readFileSync("results.json", "utf8")).stats;
            const ran = (s.expected || 0) + (s.unexpected || 0) + (s.flaky || 0);
            console.log(`playwright ran ${ran} tests (expected=${s.expected} unexpected=${s.unexpected} flaky=${s.flaky} skipped=${s.skipped})`);
            if (ran === 0) { console.error("zero tests ran"); process.exit(1); }
          '
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: playwright-report-${{ matrix.shard }}
          path: |
            web/playwright-report
            web/test-results
            web/results.json
          if-no-files-found: ignore
          retention-days: 7
